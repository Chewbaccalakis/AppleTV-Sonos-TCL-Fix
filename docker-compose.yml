services:
  flush-cec:
    image: ghcr.io/chewbaccalakis/appletv-sonos-tcl-fix:latest
    container_name: flush-cec
    restart: unless-stopped
    environment:
      TV_IP: 192.168.1.50   # required: your TV's IP address
      TV_PORT: 5555         # ADB network debugging port
      INTERVAL: 900         # seconds between checks (15 min)
      RETRY: 60             # seconds to wait after a failed connection
      TZ: Etc/UTC           # log timezone, e.g. America/Los_Angeles
    volumes:
      - ./adbkey:/root/.android   # keeps the ADB key so the TV only asks to approve it once
